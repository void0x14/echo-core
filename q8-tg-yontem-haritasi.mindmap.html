arif uzayında senin istediğini yapar, o tahmin ettiğini sanır","children":[],"payload":{"tag":"li","lines":"810,811"}},{"content":"Black box hacking gibi: istek at, gelen cevaba bak, ona göre işini yap; \"mümkün değil\" ayakları geç","children":[],"payload":{"tag":"li","lines":"811,812"}},{"content":"Hiçbir şeyi tasarlandığı gibi kullanmam, her zaman kendi çıkarım için; \"ya öyle değilse?\"","children":[],"payload":{"tag":"li","lines":"812,813"}}],"payload":{"tag":"li","lines":"808,813"}},{"content":"<strong>2. Fırtına</strong>","children":[{"content":"Komutan (Core 1): 3 emir, ortaya konuşur, koordine eder","children":[],"payload":{"tag":"li","lines":"814,815"}},{"content":"Ordu (Core 2–3): kendi kimlikleri; kaos cep evrenlerini ortadaki emirden kendine çeker","children":[],"payload":{"tag":"li","lines":"815,816"}},{"content":"Yeşil bulut / mikro tarif: atlı, takım taklavatı kontrol eder, buluta gönderir; kararana kadar içine alır, süblimleşir","children":[],"payload":{"tag":"li","lines":"816,817"}},{"content":"Kara delik = fırtınanın gözü = dinginlik; mor = çevre, rüzgâr hızlanır, hava soğur, tam kaos","children":[],"payload":{"tag":"li","lines":"817,818"}},{"content":"Bitince yerçekimiyle çakılma → düşüş <strong>Infinity Fabric</strong> → <strong>IO die</strong> (CCD→cIOD, şemayla doğrulandı)","children":[],"payload":{"tag":"li","lines":"818,819"}}],"payload":{"tag":"li","lines":"813,819"}},{"content":"<strong>3. Verim yalan, efficiency gerçek</strong>","children":[{"content":"Ortak yok; devir daim, takım taklavat var; uyursan ölürsün; fırıncı gibi sürekli üretim","children":[],"payload":{"tag":"li","lines":"820,821"}},{"content":"\"L1 L2 L3'te çalışmazsak hızlı olamayız\" yanlış; her nokta tasarım harikası","children":[],"payload":{"tag":"li","lines":"821,822"}}],"payload":{"tag":"li","lines":"819,822"}},{"content":"<strong>4. CPU'yu depolama birimi olarak kullanma</strong>","children":[{"content":"Veri her daim CPU'da dolaşır, kan hücreleri / alyuvar gibi; sabi
